
name: farmart-ips

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-farmart}
      POSTGRES_USER: ${DB_USERNAME:-farmart}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - backend

  migrate:
    build:
      context: .
      target: php
    env_file:
      - .env
    command:
      - sh
      - -ec
      - |
        php artisan migrate --force
        php artisan db:seed --force
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  api:
    build:
      context: .
      target: php
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - backend

  nginx:
    build:
      context: .
      target: nginx
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
